<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tbilisi Trans Support</title>
  <meta name="description" content="Support page for Tbilisi Trans.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --text: #111827;
      --muted: #4b5563;
      --border: #e5e7eb;
      --link: #0f766e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #1f2937;
        --link: #5eead4;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 16px 40px;
    }

    h1,
    h2 {
      line-height: 1.25;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.9rem;
    }

    h2 {
      margin: 1.8rem 0 0.75rem;
      font-size: 1.2rem;
    }

    p {
      margin: 0 0 1rem;
    }

    .muted {
      color: var(--muted);
    }

    a {
      color: var(--link);
    }

    form {
      margin-top: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--link);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .row {
      margin-bottom: 14px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      min-height: 44px;
      padding: 0 16px;
      font: inherit;
      font-weight: 600;
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <p class="muted">Ask questions, send feedback or report an issue.</p>
    <p>Email: <a href="mailto:samshabrg+tbstrans@gmail.com">samshabrg+tbstrans@gmail.com</a></p>
  </main>
</body>

</html>
